<!-- 3)Whenever user input a text in the text box in any case (i.e upper or lower case), automatically it should be converted to uppercase.Design an Html page to implement above functionality using html Dom event "oncahnge"-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uppercase Input on Change</title>
</head>
<body>
    <h2>Enter Some Text (Converts to Uppercase on Change)</h2>
    <input type="text" id="textInput" onchange="convertToUppercase()">

    <script>
        function convertToUppercase() {
            const inputField = document.getElementById('textInput');
            inputField.value = inputField.value.toUpperCase();
        }
    </script>
</body>
</html>
