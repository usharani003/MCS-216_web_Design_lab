<!-- 1. Write an HTML code using JavaScriptto add two numbers taken as input from user
and display the result of division operation on them i.e. a/b. If an error occurs, show
the error. Use error handling concepts in JavaScript.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Division Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: medium;
        }
        label, input {
            display: inline-block;
            margin: 10px 0;
        }
        button {
            padding: 5px 10px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            font-weight: bold;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

    <h2>Division Calculator</h2>
    <label for="num1">Enter First Number :</label>
    <input type="number" id="num1" placeholder="Enter a number"><br>

    <label for="num2">Enter Second Number :</label>
    <input type="number" id="num2" placeholder="Enter a number"><br><br>

    <button onclick="performDivision()">Divide</button>

    <div id="result" class="result"></div>
    <script>
        function performDivision() {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const resultDiv = document.getElementById('result');

            try {
                if (isNaN(num1) || isNaN(num2)) {
                    throw new Error('Both inputs must be valid numbers.');
                }
                if (num2 === 0) {
                    throw new Error('Cannot divide by zero.');
                }
                const result = num1 / num2;
                resultDiv.textContent = `Result: ${result}`;
                resultDiv.className = 'result';
            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }
    </script>

</body>
</html>
