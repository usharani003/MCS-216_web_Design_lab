<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1st Year Timetable</title>
  <link rel="stylesheet" href="All_years.css">
  <style>
    table.timetable thead {
      background-color: yellow;
      color: black;
    }
  </style>
</head>
<body>
  <header>
    <h1>4th Year Timetable</h1>
  </header>
  <table class="timetable">
    <thead>
      <tr>
        <th>Time</th>
        <th>Monday</th>
        <th>Tuesday</th>
        <th>Wednesday</th>
        <th>Thursday</th>
        <th>Friday</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>9:00 - 10:00</td>
        <td>Cyber Security</td>
        <td>Physics</td>
        <td>Chemistry</td>
        <td>c++</td>
        <td>Data science</td>
      </tr>
      <tr>
        <td>10:00 - 11:00</td>
        <td>Physics</td>
        <td>Chemistry</td>
        <td>Cyber Security</td>
        <td>Data science</td>
        <td>c++</td>
      </tr>
      <tr>
        <td colspan="6" class="break">Break</td>
      </tr>
      <tr>
        <td>11:30 - 12:30</td>
        <td>c++</td>
        <td>Data science</td>
        <td>Cyber Security</td>
        <td>Physics</td>
        <td>Chemistry</td>
      </tr>
      <tr>
        <td colspan="6" class="lunch">Lunch</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
