<!--2.Considering exercise 1, modify the web page to display the cookie's name-value pair
separately as shown in figure below.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View All Cookies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #cookieList {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .cookie-item {
            margin: 5px 0;
        }
        .cookie-item span {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>View All Cookies</h2>
    <button onclick="displayCookies()">Display Cookies</button>

    <div id="cookieList">Cookies will appear here...</div>

    <script>
        // Function to display all cookies
        function displayCookies() {
            const cookieListDiv = document.getElementById('cookieList');
            const cookies = document.cookie.split(';');
            cookieListDiv.innerHTML = ''; // Clear current list

            if (cookies.length === 0) {
                cookieListDiv.innerHTML = 'No cookies found.';
                return;
            }

            cookies.forEach(cookie => {
                const cookiePair = cookie.trim().split('=');
                const cookieName = decodeURIComponent(cookiePair[0]);
                const cookieValue = decodeURIComponent(cookiePair[1]);
                const cookieItem = document.createElement('div');
                cookieItem.classList.add('cookie-item');
                cookieItem.innerHTML = `<span>${cookieName}:</span> ${cookieValue}`;
                cookieListDiv.appendChild(cookieItem);
            });
        }
    </script>

</body>
</html>
