<!--1. Write a JavaScript code to perform the two-digit arithmetic operations: Addition,
Subtraction, Multiplication and Division. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic Operations</title>
</head>

<body>
    <h2>Arithmetic Operations on Two-Digit Numbers</h2>
    <div>
        <p id="output"></p>
    </div>

    <script>
        // Define two-digit numbers
        const num1 = 9;
        const num2 = 20;

        // Perform arithmetic operations
        const addition = num1 + num2;
        const subtraction = num1 - num2;
        const multiplication = num1 * num2;
        const division = num1 / num2;

        // Display results
        const result = `
            <strong>Results:</strong><br>
            Addition: ${num1} + ${num2} = ${addition}<br>
            Subtraction: ${num1} - ${num2} = ${subtraction}<br>
            Multiplication: ${num1} * ${num2} = ${multiplication}<br>
            Division: ${num1} / ${num2} = ${division.toFixed(2)}<br>
        `;

        document.getElementById("output").innerHTML = result;
    </script>
</body>

</html>
